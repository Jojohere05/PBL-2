name: FinGuard Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Repository URL to scan'
        required: false
        type: string

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Download private datasets
        env:
          GDRIVE_COMPLIANCE_ID: ${{ secrets.GDRIVE_COMPLIANCE_ID }}
          GDRIVE_GITLEAKS_TOML: ${{ secrets.GDRIVE_GITLEAKS_TOML }}
          GDRIVE_OSV_FOLDER_ID: ${{ secrets.GDRIVE_OSV_FOLDER_ID }}
        run: |
          python scripts/download_data.py

      - name: Validate datasets
        run: |
          python scripts/validate_datasets.py

      - name: Run security scan
        id: scan
        run: |
          python -c "
          import asyncio
          import json
          from api.adk_agents.orchestrator_agent import OrchestratorAgent
          from api.risk_engine import calculate_risk_score, get_risk_level

          async def main():
              orchestrator = OrchestratorAgent()

              import os
              from pathlib import Path

              files = {}
              scan_extensions = {'.py', '.js', '.ts', '.jsx', '.tsx', '.tf', '.yaml', '.yml'}

              for root, dirs, filenames in os.walk('.'):
                  dirs[:] = [d for d in dirs if d not in {
                      'node_modules', '.git', 'venv', '__pycache__',
                      'dist', 'build', 'data'
                  }]

                  for filename in filenames:
                      filepath = Path(root) / filename
                      if filepath.suffix in scan_extensions:
                          try:
                              content = filepath.read_text(encoding='utf-8', errors='ignore')
                              files[str(filepath)] = content
                          except:
                              pass

              print(f'Scanning {len(files)} files...')

              results = await orchestrator.scan_repository(files)

              risk_score = calculate_risk_score(results['findings'])
              risk_level = get_risk_level(risk_score)

              print(f'\n=== Scan Results ===')
              print(f'Files scanned: {results[\"summary\"][\"scanned_files\"]}')
              print(f'Total findings: {results[\"summary\"][\"total_findings\"]}')
              print(f'Critical: {results[\"summary\"][\"by_severity\"].get(\"critical\", 0)}')
              print(f'High: {results[\"summary\"][\"by_severity\"].get(\"high\", 0)}')
              print(f'Medium: {results[\"summary\"][\"by_severity\"].get(\"medium\", 0)}')
              print(f'Low: {results[\"summary\"][\"by_severity\"].get(\"low\", 0)}')
              print(f'Risk Score: {risk_score}/100 ({risk_level})')

              with open('scan-summary.json', 'w') as f:
                  json.dump({
                      'risk_score': risk_score,
                      'risk_level': risk_level,
                      'summary': results['summary'],
                      'findings_count': len(results['findings'])
                  }, f)

              critical = results['summary']['by_severity'].get('critical', 0)
              high = results['summary']['by_severity'].get('high', 0)

              if critical > 0:
                  print(f'\n❌ Security scan failed: {critical} critical issues found')
                  exit(1)
              else:
                  print(f'\n✅ Security scan passed (high={high} treated as warning only)')

          asyncio.run(main())
          "

      - name: Upload scan results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scan-results
          path: scan-summary.json

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let summary;
            try {
              summary = JSON.parse(fs.readFileSync('scan-summary.json', 'utf8'));
            } catch (e) {
              summary = { risk_score: 'N/A', risk_level: 'unknown', summary: { by_severity: {} } };
            }

            const body = `## 🔒 FinGuard Security Scan Results

            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${summary.summary.by_severity?.critical || 0} |
            | 🟠 High | ${summary.summary.by_severity?.high || 0} |
            | 🟡 Medium | ${summary.summary.by_severity?.medium || 0} |
            | 🟢 Low | ${summary.summary.by_severity?.low || 0} |

            **Risk Score:** ${summary.risk_score}/100 (${summary.risk_level})

            ---
            *Powered by FinGuard Security Scanner*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
