name: FinGuard Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  scan:
    runs-on: ubuntu-latest

    env:
      FINGUARD_API_URL: ${{ secrets.FINGUARD_API_URL }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Zip repository (exclude heavy folders)
        run: |
          zip -r repo.zip . \
            -x "*.git*" "node_modules/*" "frontend/node_modules/*" "venv/*" "dist/*" "build/*" "__pycache__/*"

      - name: Call FinGuard backend API
        id: call_api
        run: |
          if [ -z "${FINGUARD_API_URL}" ]; then
            echo "FINGUARD_API_URL is not set. Configure it as a repository secret pointing to your FinGuard backend (e.g. https://your-app.railway.app)." >&2
            exit 1
          fi

          echo "Calling FinGuard at ${FINGUARD_API_URL}/api/scan ..."

          resp=$(curl -sS -X POST "${FINGUARD_API_URL}/api/scan" \
            -F "file=@repo.zip" \
            -H "Accept: application/json")

          echo "Raw response from FinGuard:" 
          echo "$resp"

          echo "$resp" > finguard-result.json

          python - << 'PY'
import json, sys

try:
    data = json.load(open('finguard-result.json', 'r', encoding='utf-8'))
except Exception as e:
    print(f"Failed to parse FinGuard JSON: {e}")
    sys.exit(1)

decision = data.get('decision', 'ALLOW')
score    = data.get('risk_score', 0)
summary  = data.get('summary', {})

print("\n=== FinGuard Decision ===")
print(f"Decision : {decision}")
print(f"Score    : {score}/100")
print(f"Summary  : {json.dumps(summary, indent=2)}")

blocked = decision.upper() == 'BLOCK'
print(f"::set-output name=decision::{decision}")
print(f"::set-output name=score::{score}")
if blocked:
    sys.exit(1)
PY

      - name: Upload JSON result artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: finguard-result
          path: finguard-result.json

      - name: Comment on PR with summary
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            let result;
            try {
              result = JSON.parse(fs.readFileSync('finguard-result.json', 'utf8'));
            } catch (e) {
              core.warning(`Could not read finguard-result.json: ${e}`);
              result = { risk_score: 'N/A', decision: 'unknown', summary: { by_severity: {} } };
            }

            const bySev = result.summary?.by_severity || {};

            const body = `## 🔒 FinGuard Security Scan Results

            | Severity | Count |
            |----------|-------|
            | 🔴 Critical | ${bySev.CRITICAL || 0} |
            | 🟠 High | ${bySev.HIGH || 0} |
            | 🟡 Medium | ${bySev.MEDIUM || 0} |
            | 🟢 Low | ${bySev.LOW || 0} |

            **Risk Score:** ${result.risk_score}/100
            **Decision:** ${result.decision}

            
            <details>
            <summary>Raw JSON output</summary>

            
            
            \`${JSON.stringify(result)}\`
            
            </details>

            ---
            *Powered by FinGuard Compliance Scanner*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      # Optional: send email on BLOCK decision using an SMTP-based action
      # Configure secrets like MAIL_HOST, MAIL_PORT, MAIL_USERNAME, MAIL_PASSWORD, MAIL_TO before enabling.
